<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة موبايل ليجندز - آركيد ستور</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .settings-grid, .store-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
        }
        .store-info-grid {
            background: #e8f6f3;
            border: 1px solid #1abc9c;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 15px;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        .product-input {
            width: 60px;
            text-align: center;
        }
        .highlight {
            font-weight: bold;
            color: #27ae60;
        }
        .copy-btn {
            display: block;
            width: 100%;
            background-color: #25D366;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .copy-btn:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>حاسبة موبايل ليجندز - آركيد ستور</h1>
    
    <!-- بيانات المتجر (للنشر في الواتساب) -->
    <div class="store-info-grid">
        <div class="input-group">
            <label>رابط الموقع</label>
            <input type="text" id="websiteUrl" value="arcadestore.net" placeholder="مثال: arcadestore.net" oninput="saveDataLocally()">
        </div>
        <div class="input-group">
            <label>رقم الواتساب</label>
            <input type="text" id="whatsappNum" value="" placeholder="مثال: +249123456789" oninput="saveDataLocally()">
        </div>
    </div>

    <!-- إعدادات المتغيرات اليومية -->
    <div class="settings-grid">
        <div class="input-group">
            <label>إجمالي الشراء بالدولار ($)</label>
            <input type="number" id="usdPaid" value="100" oninput="calculatePrices()">
        </div>
        <div class="input-group">
            <label>إجمالي العملات المستلمة</label>
            <input type="number" id="coinsReceived" value="10000" oninput="calculatePrices()">
        </div>
        <div class="input-group">
            <label>سعر الصرف اليومي (محلي)</label>
            <input type="number" id="exchangeRate" value="2500" oninput="calculatePrices()">
        </div>
        <div class="input-group">
            <label>تكلفة العملة ($)</label>
            <input type="text" id="coinCostDisplay" disabled style="background:#e8e8e8; font-weight:bold;">
        </div>
    </div>

    <!-- جدول المنتجات -->
    <table id="pricingTable">
        <thead>
            <tr>
                <th>المنتج</th>
                <th>تكلفة المنصة</th>
                <th>التكلفة ($)</th>
                <th>التكلفة المحلي</th>
                <th>الربح (%)</th>
                <th>سعر البيع</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات هنا -->
        </tbody>
    </table>

    <!-- زر نسخ القائمة -->
    <button class="copy-btn" onclick="copyToWhatsApp()">📋 نسخ القائمة لنشرها في الواتساب</button>
</div>

<script>
    // قائمة منتجات موبايل ليجندز بوضع نسبة مئوية للربح (مثلاً 15%)
    let products = [
        // المضاعفة لأول مرة
        { name: '50+5', costInCoins: 0, profitMargin: 15, category: 'المضاعفة لأول مرة' },
        { name: '150+15', costInCoins: 0, profitMargin: 15, category: 'المضاعفة لأول مرة' },
        { name: '250+25', costInCoins: 0, profitMargin: 15, category: 'المضاعفة لأول مرة' },
        { name: '500+65', costInCoins: 0, profitMargin: 15, category: 'المضاعفة لأول مرة' },
        
        // العروض العادية
        { name: '78+8', costInCoins: 0, profitMargin: 15, category: 'العروض العادية' },
        { name: '156+16', costInCoins: 0, profitMargin: 15, category: 'العروض العادية' },
        { name: '234+23', costInCoins: 0, profitMargin: 15, category: 'العروض العادية' },
        { name: '625+81', costInCoins: 0, profitMargin: 15, category: 'العروض العادية' },
        { name: '1860+335', costInCoins: 0, profitMargin: 15, category: 'العروض العادية' },
        { name: '3099+589', costInCoins: 0, profitMargin: 15, category: 'العروض العادية' },
        { name: '4649+883', costInCoins: 0, profitMargin: 15, category: 'العروض العادية' },
        { name: '7740+1548', costInCoins: 0, profitMargin: 15, category: 'العروض العادية' },
        
        // الاشتراكات والحزم
        { name: 'Weekly Pass', costInCoins: 0, profitMargin: 15, category: 'الاشتراكات والحزم' },
        { name: 'حزمة الأزهار', costInCoins: 0, profitMargin: 15, category: 'الاشتراكات والحزم' }
    ];

    // استرجاع البيانات المحفوظة في المتصفح
    function loadSavedData() {
        const savedData = localStorage.getItem('arcadeStoreMLBB_v2');
        if (savedData) {
            const data = JSON.parse(savedData);
            document.getElementById('usdPaid').value = data.usdPaid || 100;
            document.getElementById('coinsReceived').value = data.coinsReceived || 10000;
            document.getElementById('exchangeRate').value = data.exchangeRate || 2500;
            document.getElementById('websiteUrl').value = data.websiteUrl || 'arcadestore.net';
            document.getElementById('whatsappNum').value = data.whatsappNum || '';
            
            if (data.products && data.products.length === products.length) {
                products = data.products;
            }
        }
    }

    // حفظ البيانات في المتصفح
    function saveDataLocally() {
        const dataToSave = {
            usdPaid: document.getElementById('usdPaid').value,
            coinsReceived: document.getElementById('coinsReceived').value,
            exchangeRate: document.getElementById('exchangeRate').value,
            websiteUrl: document.getElementById('websiteUrl').value,
            whatsappNum: document.getElementById('whatsappNum').value,
            products: products
        };
        localStorage.setItem('arcadeStoreMLBB_v2', JSON.stringify(dataToSave));
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        products.forEach((product, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align:right;"><strong>${product.name}</strong><br><small style="color:gray;">${product.category}</small></td>
                <td><input type="number" class="product-input" id="coins-${index}" value="${product.costInCoins}" oninput="updateProduct(${index}, 'costInCoins')"></td>
                <td id="usdCost-${index}">0</td>
                <td id="localCost-${index}">0</td>
                <td><input type="number" class="product-input" id="profit-${index}" value="${product.profitMargin}" oninput="updateProduct(${index}, 'profitMargin')">%</td>
                <td id="finalPrice-${index}" class="highlight">0</td>
            `;
            tbody.appendChild(tr);
        });
        calculatePrices();
    }

    function updateProduct(index, field) {
        const inputVal = parseFloat(document.getElementById(field === 'costInCoins' ? `coins-${index}` : `profit-${index}`).value) || 0;
        products[index][field] = inputVal;
        calculatePrices();
    }

    function calculatePrices() {
        const usdPaid = parseFloat(document.getElementById('usdPaid').value) || 0;
        const coinsReceived = parseFloat(document.getElementById('coinsReceived').value) || 1;
        const exchangeRate = parseFloat(document.getElementById('exchangeRate').value) || 0;

        const coinCostUsd = usdPaid / coinsReceived;
        document.getElementById('coinCostDisplay').value = coinCostUsd.toFixed(4);

        products.forEach((product, index) => {
            // التكلفة بالدولار
            const usdCost = product.costInCoins * coinCostUsd;
            document.getElementById(`usdCost-${index}`).innerText = usdCost.toFixed(2);

            // التكلفة بالعملة المحلية
            const localCost = usdCost * exchangeRate;
            document.getElementById(`localCost-${index}`).innerText = Math.round(localCost).toLocaleString();

            // حساب السعر النهائي بناءً على النسبة المئوية
            // المعادلة: التكلفة + (التكلفة × النسبة / 100)
            const profitPercentage = product.profitMargin / 100;
            const finalPrice = localCost + (localCost * profitPercentage);
            
            product.calculatedPrice = Math.round(finalPrice);
            document.getElementById(`finalPrice-${index}`).innerText = product.calculatedPrice.toLocaleString();
        });
        
        saveDataLocally();
    }

    function copyToWhatsApp() {
        const website = document.getElementById('websiteUrl').value || 'غير متوفر';
        const whatsapp = document.getElementById('whatsappNum').value || 'غير متوفر';
        
        let text = `🎮 *عروض شحن موبايل ليجندز (MLBB) من آركيد ستور* 🎮\n\n`;
        
        const categories = {};
        products.forEach(p => {
            if (!categories[p.category]) categories[p.category] = [];
            categories[p.category].push(p);
        });

        for (const [category, items] of Object.entries(categories)) {
            text += `🔥 *${category}* 🔥\n`;
            items.forEach(item => {
                // التأكد من أن التكلفة أكبر من صفر حتى يظهر في الرسالة
                if (item.costInCoins > 0) {
                    text += `▪️ ${item.name} ⬅️ *${item.calculatedPrice.toLocaleString()}* جنيه\n`;
                }
            });
            text += `\n`;
        }

        text += `🌐 *للطلب عبر الموقع:* ${website}\n`;
        text += `📱 *للتواصل واتسآب:* ${whatsapp}\n`;

        navigator.clipboard.writeText(text).then(() => {
            alert('✅ تم نسخ القائمة بنجاح! جاهزة للصق في الواتساب.');
        }).catch(err => {
            alert('❌ حصل خطأ في النسخ، الرجاء المحاولة مرة أخرى.');
        });
    }

    // تشغيل دوال الاسترجاع ثم بناء الجدول عند تحميل الصفحة
    window.onload = function() {
        loadSavedData();
        renderTable();
    };
</script>

</body>
</html>
