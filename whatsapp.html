<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسعير آركيد ستور - Arcade Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #444; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; color: white; }
        .btn-calc { background-color: #3498db; }
        .btn-calc:hover { background-color: #2980b9; }
        .btn-copy { background-color: #27ae60; display: none; }
        .btn-copy:hover { background-color: #219150; }
        textarea { width: 100%; height: 210px; padding: 15px; border: 2px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 16px; resize: none; display: none; box-sizing: border-box; margin-top: 15px; background-color: #fcfcfc;}
    </style>
</head>
<body>
    <div class="container">
        <h2>📱 تسعير منتج للواتساب</h2>
        
        <label>سعر الصرف (لليوم):</label>
        <input type="number" id="exchangeRate" value="1">
        
        <label>نسبة الربح المطلوبة (%):</label>
        <input type="number" id="profitMargin" value="0">

        <label>اختر القسم:</label>
        <select id="categorySelect" onchange="updateProducts()">
            <option value="">-- اختر القسم أولاً --</option>
        </select>

        <label>اختر المنتج:</label>
        <select id="productSelect">
            <option value="">-- بانتظار اختيار القسم --</option>
        </select>

        <label>رقم الواتساب (اختياري):</label>
        <input type="text" id="waNumber" placeholder="مثال: 249xxxxxxxxx+">

        <label>رابط الموقع (اختياري):</label>
        <input type="text" id="websiteUrl" placeholder="مثال: arcadestore.com">

        <button class="btn-calc" onclick="generateMessage()">تجهيز رسالة المنتج 🚀</button>

        <textarea id="output" readonly></textarea>
        <button class="btn-copy" id="copyBtn" onclick="copyText()">نسخ للواتساب 📋</button>
    </div>

    <script>
        // --- قائمة منتجات آركيد ستور ---
        const productsData = [
            { category: "🎮 شحن الألعاب", items: [
                { name: "فري فاير", baseCost: 1.00 },
                { name: "ببجي", baseCost: 1.00 },
                { name: "بيس", baseCost: 1.00 },
                { name: "موبايل ليجنزر", baseCost: 1.00 },
                { name: "بلودسترايك", baseCost: 1.00 },
                { name: "كول اوف ديوتي", baseCost: 1.00 },
                { name: "كلاش كلانس", baseCost: 1.00 },
                { name: "كلاش رويال", baseCost: 1.00 },
                { name: "براول ستارز", baseCost: 1.00 },
                { name: "فيفا", baseCost: 1.00 },
                { name: "ربولوكس", baseCost: 1.00 }
            ]},
            { category: "💳 البطاقات الرقمية", items: [
                { name: "بطاقات ريزر", baseCost: 1.00 },
                { name: "بطاقات ايتونز", baseCost: 1.00 },
                { name: "بطاقات ستيم", baseCost: 1.00 },
                { name: "بطاقات بلاستشين", baseCost: 1.00 },
                { name: "بطاقات اكس بوكس", baseCost: 1.00 }
            ]},
            { category: "🏦 البطاقات البنكية", items: [
                { name: "فيزا كارد", baseCost: 1.00 },
                { name: "ماشترد كارد", baseCost: 1.00 }
            ]},
            { category: "📱 التطبيقات والاشتراكات", items: [
                { name: "تيك توك", baseCost: 1.00 },
                { name: "ديسكورد", baseCost: 1.00 },
                { name: "اشتراك جمناي", baseCost: 1.00 },
                { name: "اشتراك شات جي بي تي", baseCost: 1.00 },
                { name: "اشتراك كلاود", baseCost: 1.00 }
            ]},
            { category: "📡 خدمات الإنترنت", items: [
                { name: "استارلينك", baseCost: 1.00 }
            ]}
        ];

        const catSelect = document.getElementById('categorySelect');
        const prodSelect = document.getElementById('productSelect');

        // تحميل الأقسام
        window.onload = () => {
            productsData.forEach((cat, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.innerHTML = cat.category;
                catSelect.appendChild(opt);
            });
        };

        // تحديث المنتجات
        function updateProducts() {
            prodSelect.innerHTML = '<option value="">-- اختر المنتج --</option>';
            let catIndex = catSelect.value;
            if(catIndex !== "") {
                productsData[catIndex].items.forEach((item, index) => {
                    let opt = document.createElement('option');
                    opt.value = index;
                    opt.innerHTML = item.name;
                    prodSelect.appendChild(opt);
                });
            }
        }

        // تجهيز الرسالة
        function generateMessage() {
            let catIndex = catSelect.value;
            let prodIndex = prodSelect.value;
            
            if(catIndex === "" || prodIndex === "") {
                alert("الرجاء اختيار القسم والمنتج أولاً!");
                return;
            }

            let item = productsData[catIndex].items[prodIndex];
            let exRate = parseFloat(document.getElementById('exchangeRate').value) || 1;
            let margin = parseFloat(document.getElementById('profitMargin').value) || 0;
            
            // جلب البيانات من الخانات الجديدة
            let waNum = document.getElementById('waNumber').value.trim();
            let webUrl = document.getElementById('websiteUrl').value.trim();

            let localCost = item.baseCost * exRate;
            let finalPrice = Math.ceil(localCost + (localCost * (margin / 100)));

            let msg = `🎮 *آركيد ستور - Arcade Store* 🎮\n\n`;
            msg += `متوفر لدينا الآن:\n`;
            msg += `🔸 *${item.name}*\n\n`;
            msg += `💵 السعر: *${finalPrice}* ج\n\n`;
            msg += `للطلب والاستفسار، تواصل معنا على الخاص! 💬\n`;
            
            // إضافة رقم الواتساب والموقع لو ما كانوا فاضيات
            if (waNum !== "") {
                msg += `📞 واتساب: ${waNum}\n`;
            }
            if (webUrl !== "") {
                msg += `🌐 موقعنا: ${webUrl}\n`;
            }

            let outBox = document.getElementById('output');
            outBox.value = msg;
            outBox.style.display = 'block';

            let btn = document.getElementById('copyBtn');
            btn.style.display = 'block';
            btn.innerText = 'نسخ للواتساب 📋';
            btn.style.backgroundColor = '#27ae60';
        }

        // نسخ النص
        function copyText() {
            let outBox = document.getElementById('output');
            outBox.select();
            outBox.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(outBox.value);
            
            let btn = document.getElementById('copyBtn');
            btn.innerText = 'تم النسخ بنجاح! ✔️';
            btn.style.backgroundColor = '#2ecc71';
        }
    </script>
</body>
</html>
