<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسعير آركيد ستور الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .game-selector {
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .game-selector label {
            color: white;
            font-size: 16px;
            margin: 0;
        }
        .game-selector select {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
        }
        .settings-grid, .store-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
        }
        .store-info-grid {
            background: #e8f6f3;
            border: 1px solid #1abc9c;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 15px;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        .product-input {
            width: 60px;
            text-align: center;
        }
        .highlight {
            font-weight: bold;
            color: #27ae60;
        }
        .copy-btn {
            display: block;
            width: 100%;
            background-color: #25D366;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .copy-btn:hover {
            background-color: #128C7E;
        }
    </style>
</head>

    </div>

    </div>

    <!-- إعدادات الشراء وسعر الصرف -->
    <div class="settings-grid">

        </div>
        <div class="input-group">
            <label>تكلفة العملة الواحدة ($)</label>

        </div>
    </div>

        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات هنا -->

    </table>

    <!-- زر نسخ القائمة -->
    <button class="copy-btn" onclick="copyToWhatsApp()">📋 نسخ عروض القسم المحدد للواتساب</button>
</div>

    let currentGame = "فري فاير"; // اللعبة الافتراضية

    // استرجاع البيانات - تم تغيير مفتاح الحفظ لـ v2 عشان ينزل الداتا الجديدة
    function loadSavedData() {
        const savedData = localStorage.getItem('arcadeStore_Dashboard_v2');
        if (savedData) {
            const data = JSON.parse(savedData);
            document.getElementById('usdPaid').value = data.usdPaid || 100;
            document.getElementById('coinsReceived').value = data.coinsReceived || 10000;
            document.getElementById('exchangeRate').value = data.exchangeRate || 2500;
            document.getElementById('websiteUrl').value = data.websiteUrl || 'arcadestore.net';
            document.getElementById('whatsappNum').value = data.whatsappNum || '';
            
            // دمج البيانات
            if (data.allGamesData) {
                // التأكد من استرجاع البيانات المحفوظة للألعاب الموجودة فقط
                for (let game in allGamesData) {
                    if (data.allGamesData[game] && data.allGamesData[game].length === allGamesData[game].length) {
                        allGamesData[game] = data.allGamesData[game];
                    }
                }
            }
        }
    }

    // حفظ كل البيانات
    function saveDataLocally() {
        const dataToSave = {
            usdPaid: document.getElementById('usdPaid').value,
            coinsReceived: document.getElementById('coinsReceived').value,
            exchangeRate: document.getElementById('exchangeRate').value,
            websiteUrl: document.getElementById('websiteUrl').value,
            whatsappNum: document.getElementById('whatsappNum').value,
            allGamesData: allGamesData
        };
        localStorage.setItem('arcadeStore_Dashboard_v2', JSON.stringify(dataToSave));
    }

    function changeGame() {
        currentGame = document.getElementById('gameSelect').value;
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const products = allGamesData[currentGame];

        products.forEach((product, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align:right;"><strong>${product.name}</strong><br><small style="color:gray;">${product.category}</small></td>
                <td><input type="number" class="product-input" id="coins-${index}" value="${product.costInCoins}" oninput="updateProduct(${index}, 'costInCoins')"></td>
                <td id="usdCost-${index}">0</td>
                <td id="localCost-${index}">0</td>
                <td><input type="number" class="product-input" id="profit-${index}" value="${product.profitMargin}" oninput="updateProduct(${index}, 'profitMargin')">%</td>
                <td id="finalPrice-${index}" class="highlight">0</td>
            `;
            tbody.appendChild(tr);
        });
        calculatePrices();
    }

    function updateProduct(index, field) {
        const inputVal = parseFloat(document.getElementById(field === 'costInCoins' ? `coins-${index}` : `profit-${index}`).value) || 0;
        allGamesData[currentGame][index][field] = inputVal;
        calculatePrices();
    }

    function calculatePrices() {
        const usdPaid = parseFloat(document.getElementById('usdPaid').value) || 0;
        const coinsReceived = parseFloat(document.getElementById('coinsReceived').value) || 1;
        const exchangeRate = parseFloat(document.getElementById('exchangeRate').value) || 0;

        const coinCostUsd = usdPaid / coinsReceived;
        document.getElementById('coinCostDisplay').value = coinCostUsd.toFixed(4);

        const products = allGamesData[currentGame];

        products.forEach((product, index) => {
            const usdCost = product.costInCoins * coinCostUsd;
            document.getElementById(`usdCost-${index}`).innerText = usdCost.toFixed(2);

            const localCost = usdCost * exchangeRate;
            document.getElementById(`localCost-${index}`).innerText = Math.round(localCost).toLocaleString();

            const profitPercentage = product.profitMargin / 100;
            const finalPrice = localCost + (localCost * profitPercentage);
            
            product.calculatedPrice = Math.round(finalPrice);
            document.getElementById(`finalPrice-${index}`).innerText = product.calculatedPrice.toLocaleString();
        });
        
        saveDataLocally();
    }

    function copyToWhatsApp() {
        const website = document.getElementById('websiteUrl').value || 'غير متوفر';
        const whatsapp = document.getElementById('whatsappNum').value || 'غير متوفر';
        
        let text = `🎮 *عروض ${currentGame} من آركيد ستور* 🎮\n\n`;
        
        const products = allGamesData[currentGame];
        const categories = {};
        
        products.forEach(p => {
            if (!categories[p.category]) categories[p.category] = [];
            categories[p.category].push(p);
        });

        for (const [category, items] of Object.entries(categories)) {
            text += `🔥 *${category}* 🔥\n`;
            items.forEach(item => {
                if (item.costInCoins > 0) { 
                    text += `\u200F▪️ \u200F${item.name}\u200F ⬅️ *${item.calculatedPrice.toLocaleString()}* جنيه\n`;
                }
            });
            text += `\n`;
        }

        text += `🌐 *للطلب عبر الموقع:* ${website}\n`;
        text += `📱 *للتواصل واتسآب:* ${whatsapp}\n`;

        navigator.clipboard.writeText(text).then(() => {
            alert(`✅ تم نسخ عروض ${currentGame} بنجاح! جاهزة للصق في الواتساب.`);
        }).catch(err => {
            alert('❌ حصل خطأ في النسخ، الرجاء المحاولة مرة أخرى.');
        });
    }

    window.onload = function() {
        loadSavedData();
        document.getElementById('gameSelect').value = currentGame;
        renderTable();
    };
</script>

</body>
</html>
